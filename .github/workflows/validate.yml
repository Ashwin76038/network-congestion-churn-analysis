name: Validate public simulation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/03_build_metrics.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_sql.py
      - run: python scripts/audit_public.py
      - run: python scripts/build_dax_validation.py
